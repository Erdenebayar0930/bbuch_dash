# Nginx reverse proxy — Бид туслая dashboard
#
# Байрлуулах:
#   sudo cp deploy/nginx/bid_tuslay.conf /etc/nginx/sites-available/bid_tuslay
#   sudo ln -sf /etc/nginx/sites-available/bid_tuslay /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ЭХЛЭЭД: доорх DOMAIN.MN-г өөрийн домэйнөөр солино.
# SSL блокыг certbot автоматаар нэмнэ (setup-server.sh-г үзнэ үү) —
# тиймээс эхлээд зөвхөн 80 портын блоктойгоор ачаална.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN.MN;

    # Let's Encrypt баталгаажуулалт
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Дансны хуулга, зураг, видео upload — том body зөвшөөрнө.
        client_max_body_size 50M;

        # Excel export, statement боловсруулалт удаан байж болно.
        proxy_read_timeout    300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;

        proxy_buffering off;
    }

    # Хэш нэртэй статик файлууд — Node-оор дамжуулахгүй, шууд дискнээс.
    location /_next/static/ {
        alias /var/www/bid_tuslay/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Service worker-ыг ХЭЗЭЭ Ч кэшлэхгүй — эс бөгөөс хэрэглэгч хуучин
    # хувилбарт гацна. next-pwa шинэчлэлтийг sw.js-ээр дамжуулж мэдэрдэг.
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /firebase-messaging-sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Аюулгүй байдлын толгойнууд (HSTS-ыг certbot SSL тавьсны дараа нэмнэ)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
